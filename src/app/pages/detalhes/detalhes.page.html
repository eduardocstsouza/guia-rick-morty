<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/personagens"></ion-back-button>
    </ion-buttons>
    <ion-title>Detalhes</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-card class="perfil-card">
    <img
      [src]="'https://rickandmortyapi.com/api/character/avatar/' + (id() || '1') + '.jpeg'"
      alt="Imagem do personagem"
    />

    <ion-card-content>
      <div class="perfil-cabecalho">
        <h1>Personagem #{{ id() || '1' }}</h1>
        <ion-badge color="primary">Status</ion-badge>
      </div>

      <ion-button expand="block" fill="outline" color="tertiary">
        <ion-icon slot="start" name="heart-outline" aria-hidden="true"></ion-icon>
        Favoritar
      </ion-button>
    </ion-card-content>
  </ion-card>

  <ion-list [inset]="true">
    <ion-item>
      <ion-label>
        <h3>Espécie</h3>
        <p>—</p>
      </ion-label>
    </ion-item>
    <ion-item>
      <ion-label>
        <h3>Tipo</h3>
        <p>—</p>
      </ion-label>
    </ion-item>
    <ion-item>
      <ion-label>
        <h3>Gênero</h3>
        <p>—</p>
      </ion-label>
    </ion-item>
    <ion-item>
      <ion-label>
        <h3>Origem</h3>
        <p>—</p>
      </ion-label>
    </ion-item>
    <ion-item>
      <ion-label>
        <h3>Última localização</h3>
        <p>—</p>
      </ion-label>
    </ion-item>
    <ion-item>
      <ion-label>
        <h3>Criado em</h3>
        <p>—</p>
      </ion-label>
    </ion-item>
    <ion-item>
      <ion-label>
        <h3>Episódios</h3>
        <p>—</p>
      </ion-label>
    </ion-item>
  </ion-list>
</ion-content>
