<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Episódios</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-list [inset]="true">
    @for (episodio of episodiosExemplo; track episodio.id) {
    <ion-item>
      <ion-badge slot="start" color="secondary">{{ episodio.codigo | episodeCode }}</ion-badge>
      <ion-label>
        <h2>{{ episodio.nome | uppercase }}</h2>
        <p>{{ episodio.dataExibicao | date:'dd/MM/yyyy' }} · {{ episodio.personagens }} personagens</p>
      </ion-label>
    </ion-item>
    }
  </ion-list>

  <div class="paginacao">
    <ion-button fill="outline" size="small" [disabled]="true">
      <ion-icon slot="start" name="chevron-back-outline" aria-hidden="true"></ion-icon>
      Anterior
    </ion-button>

    <span>Página 1</span>

    <ion-button fill="outline" size="small" [disabled]="true">
      Próxima
      <ion-icon slot="end" name="chevron-forward-outline" aria-hidden="true"></ion-icon>
    </ion-button>
  </div>
</ion-content>
