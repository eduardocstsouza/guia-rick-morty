<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button> </ion-menu-button>
    </ion-buttons>
    <ion-title> Início </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="hero">
    <ion-icon name="planet-outline" aria-hidden="true"></ion-icon>
    <h1>Guia Rick & Morty</h1>
    <p>Explore personagens, episódios e salve seus favoritos</p>
  </div>

  <div class="contadores">
    <ion-chip color="primary" [outline]="true"
      ><ion-label>Personagens: {{ totalPersonagens() ?? '—' }}</ion-label></ion-chip
    >
    <ion-chip color="tertiary" [outline]="true"
      ><ion-label>Favoritos: {{ favoritosService.total() }}</ion-label></ion-chip
    >
  </div>

  @for(atalho of atalhos; track atalho.rota){
  <ion-card button [routerLink]="atalho.rota" class="atalho-card" appDestaque>
    <ion-card-header>
      <ion-icon [name]="atalho.icone" [color]="atalho.cor" aria-hidden="true"></ion-icon>
      <ion-card-title>{{ atalho.titulo }}</ion-card-title>
    </ion-card-header>

    <ion-card-content> {{ atalho.descricao }} </ion-card-content>
  </ion-card>
  }
</ion-content>
